name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Check data contracts
        run: python check_contracts.py

      - name: Load sample data into DuckDB
        run: python load_raw.py

      - name: Build dbt models
        run: dbt run --profiles-dir .

      - name: Run dbt tests
        run: dbt test --profiles-dir .

      - name: Generate report
        run: python report_md.py
